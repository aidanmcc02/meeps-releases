name: Release

# The Windows installer, the updater manifest and the GitHub release are all
# built here, in this repository, from source checked out of the private Meeps
# repo. The source repo is moving to self-hosted Gitea; this is the GitHub
# foothold that has to keep working, because Tauri's updater is an
# unauthenticated HTTP client and only a public GitHub release answers it.
#
# ─── SECURITY: read this before adding a trigger ────────────────────────────
# This is a PUBLIC repository, and this workflow handles two things that must
# never reach untrusted code:
#
#   MEEPS_SOURCE_TOKEN   read access to the private source
#   TAURI_PRIVATE_KEY    the key every installed client trusts for updates
#
# It is therefore reachable only by an explicit dispatch from someone with
# write access here. Do NOT add `pull_request`, `pull_request_target`,
# `issue_comment` or `push`: the first three run code an outsider wrote, and
# none of them are how a release starts. `workflow_dispatch` is the whole
# trigger surface on purpose — keep it that way.
#
# The compromise that matters: a leaked TAURI_PRIVATE_KEY lets an attacker sign
# an update that every installed copy of Meeps would accept. Rotating it is not
# enough on its own — clients trust the pubkey baked into their binary, so a
# rotation only protects users who have already updated past it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without the leading v (e.g. 2.0.112)"
        required: true
        type: string
      ref:
        description: "Commit or branch in the source repo to build"
        required: false
        default: production
        type: string

# Read-only by default; only the publish job is granted the write it needs.
permissions:
  contents: read

env:
  SOURCE_REPO: Fat-Melons/Meeps

jobs:
  windows-installer:
    name: Windows Installer
    runs-on: windows-latest
    steps:
      # `persist-credentials: false` matters more than usual here: the default
      # leaves the source token in the runner's git config, where every later
      # step — including anything npm runs — can read it.
      - name: Checkout Meeps source
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.MEEPS_SOURCE_TOKEN }}
          persist-credentials: false
          path: source

      # The dispatcher names the version and the ref independently, so nothing
      # guarantees they agree — a stale `production`, or a re-run against a ref
      # that has moved on, would otherwise publish an installer whose filename
      # and manifest disagree with the app inside it. Cheaper to stop here.
      - name: Check the source is the version being released
        shell: bash
        run: |
          FOUND=$(node -e "console.log(require('./source/src-tauri/tauri.conf.json').package.version)")
          if [ "$FOUND" != "${{ inputs.version }}" ]; then
            echo "Asked to release ${{ inputs.version }}, but ${{ inputs.ref }} carries $FOUND."
            echo "Dispatch the ref that actually holds the version you want."
            exit 1
          fi
          echo "Building v$FOUND from ${{ inputs.ref }}."

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: source/package-lock.json

      # @stable is intentional — this action uses Rust channel names, not semver
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri

      - name: Install frontend dependencies
        run: npm ci
        working-directory: source

      # No `tagName`, so the action builds and stops — it does not cut a
      # release. The publish job below does that, after the manifest exists.
      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_BACKEND_HTTP_URL: ${{ secrets.VITE_BACKEND_HTTP_URL }}
          VITE_BACKEND_WS_URL: ${{ secrets.VITE_BACKEND_WS_URL }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: source
          tauriScript: npm run tauri
          args: --config src-tauri/tauri.production.conf.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: Meeps-Windows-Release
          path: source/src-tauri/target/release/bundle/

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [windows-installer]
    # The only write in the workflow, and it is to this repository — which is
    # the point of building here. No cross-repo token, no App installation, no
    # expiry: the release is cut by the job's own GITHUB_TOKEN.
    permissions:
      contents: write
    steps:
      # generate-latest-json.js, changelog.js and CHANGELOG.md all live in the
      # source repo, and the script reads the version out of tauri.conf.json.
      - name: Checkout Meeps source
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.MEEPS_SOURCE_TOKEN }}
          persist-credentials: false
          path: source

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: lts/*

      - name: Download Windows installer
        uses: actions/download-artifact@v8.0.1
        with:
          name: Meeps-Windows-Release
          path: artifacts/windows

      # Every download URL in the manifest points at the repo hosting the
      # assets — which is now this one, so it is read from `github.repository`
      # rather than restated. A literal here is what rotted last time: it went
      # on agreeing with itself for ~100 releases after the repo it named had
      # been renamed, while every URL it generated 404'd.
      - name: Generate the updater manifest
        run: node source/scripts/generate-latest-json.js
        env:
          LATEST_JSON_REPO: ${{ github.repository }}
          LATEST_JSON_BUNDLE_ROOT: ${{ github.workspace }}/artifacts
          LATEST_JSON_OUTPUT: ${{ github.workspace }}/artifacts/latest.json
          LATEST_JSON_TAG: "v${{ inputs.version }}"
          LATEST_JSON_REQUIRE_WINDOWS: "true"
          LATEST_JSON_NOTES: "Meeps v${{ inputs.version }}"

      # The entries promote-to-production claimed for this version. Empty when
      # nobody wrote any; every consumer below falls back to the commit message.
      - name: Read the changelog
        id: changelog
        working-directory: source
        run: |
          NOTES=$(node scripts/changelog.js extract "${{ inputs.version }}")
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$NOTES" ]; then
            echo "No CHANGELOG.md entries for v${{ inputs.version }}."
          else
            echo "$NOTES"
          fi

      - name: Resolve release artifacts
        id: artifacts
        run: |
          EXE=$(find artifacts/windows/nsis -name "*.exe" 2>/dev/null | head -1)
          MSI=$(find artifacts/windows/msi -name "*.msi" 2>/dev/null | head -1)
          ZIP=$(find artifacts/windows/nsis -name "*.nsis.zip" ! -name "*.sig" 2>/dev/null | head -1)
          SIG=$(find artifacts/windows/nsis -name "*.nsis.zip.sig" 2>/dev/null | head -1)
          LATEST_JSON="artifacts/latest.json"

          for FILE in "$EXE" "$MSI" "$ZIP" "$SIG" "$LATEST_JSON"; do
            if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
              echo "A required Windows release artifact is missing."
              exit 1
            fi
          done

          {
            echo "exe=$EXE"
            echo "msi=$MSI"
            echo "zip=$ZIP"
            echo "sig=$SIG"
            echo "latest_json=$LATEST_JSON"
          } >> "$GITHUB_OUTPUT"

      # `--latest` is not decoration: `releases/latest/download/latest.json` is
      # the endpoint compiled into every installed client, and GitHub only
      # answers it for the release it considers latest.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ steps.changelog.outputs.notes }}
        run: |
          TAG="v${{ inputs.version }}"
          NOTES="$CHANGELOG"
          if [ -z "$NOTES" ]; then
            NOTES="$(git -C source log -1 --pretty=%B)"
          fi

          gh release create "$TAG" \
            --title "Meeps v${{ inputs.version }}" \
            --notes "$NOTES" \
            --latest \
            "${{ steps.artifacts.outputs.exe }}" \
            "${{ steps.artifacts.outputs.msi }}" \
            "${{ steps.artifacts.outputs.zip }}" \
            "${{ steps.artifacts.outputs.sig }}" \
            "${{ steps.artifacts.outputs.latest_json }}"

      # A release announces itself exactly once, from here, after the release
      # exists. Nothing in the source repo posts to Discord about a release.
      - name: Post release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_POST_EXE_WEBHOOK }}
          CHANGELOG: ${{ steps.changelog.outputs.notes }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Skipping: DISCORD_POST_EXE_WEBHOOK secret not set."
            exit 0
          fi
          TAG="v${{ inputs.version }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DESCRIPTION="Version **$TAG** is now live.
          Download the installer from the [GitHub release]($RELEASE_URL)."
          if [ -n "$CHANGELOG" ]; then
            DESCRIPTION="$DESCRIPTION

          **What's new**
          $CHANGELOG"
          fi
          # Built through JSON.stringify, not a heredoc: changelog entries are
          # free text and a stray quote or backslash must not break the payload.
          TITLE="📦 Meeps $TAG released" \
          DESCRIPTION="$DESCRIPTION" \
          RELEASE_URL="$RELEASE_URL" \
          TIMESTAMP="$TIMESTAMP" \
          node -e 'require("fs").writeFileSync("/tmp/payload.json", JSON.stringify({
            embeds: [{
              title: process.env.TITLE,
              url: process.env.RELEASE_URL,
              description: process.env.DESCRIPTION,
              color: 3066993,
              footer: { text: "Meeps Release" },
              timestamp: process.env.TIMESTAMP,
            }],
          }))'
          HTTP=$(curl -sS -w "%{http_code}" -o /tmp/discord-out \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json \
            "$DISCORD_WEBHOOK")
          echo "Discord response HTTP $HTTP: $(cat /tmp/discord-out)"
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "Discord post failed."
            exit 1
          fi
          echo "Posted successfully."
